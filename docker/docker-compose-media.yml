services:

  # qBitorrent
  # Ports: 8088, 6881
  qbit:
    user: 1000:1000
    image: lscr.io/linuxserver/qbittorrent:5.1.4
    container_name: qbit
    hostname: qbit
    restart: unless-stopped
    networks:
      server_network:
        ipv4_address: 172.18.4.1
        ipv6_address: 2001:db8:1::401
    ports:
      - "8088:8088"
      # Discovery ports
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${LCL_QBIT_CONFIG}:/config
      - ${LCL_QBIT_DOWNLOADS}:/incomplete
      - ${EXT_STORAGE_BASE}:/storage
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      WEBUI_PORT: "8088"
      TORRENTING_PORT: "6881"
      DOCKER_MODS: "ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:8088" ]
      start_period: 5s
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbit.rule=Host(`qbit.225274.xyz`)"
      - "traefik.http.routers.qbit.entrypoints=websecure"
      - "traefik.http.routers.qbit.tls=true"
      - "traefik.http.services.qbit.loadbalancer.server.port=8088"
      - "traefik.http.routers.qbit.tls.certresolver=letsencrypt"

  # Cross-Seed
  # Ports: 2468
  cross-seed:
    user: 1000:1000
    command: daemon
    image: ghcr.io/cross-seed/cross-seed:6
    container_name: cross-seed
    hostname: cross-seed
    restart: unless-stopped
    networks:
      server_network:
        ipv4_address: 172.18.4.2
        ipv6_address: 2001:db8:1::402
    ports:
      - "2468:2468"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    volumes:
      - ${LCL_CROSS_SEED_CONFIG}:/config
      - ${EXT_STORAGE_BASE}:/storage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cross-seed.rule=Host(`cross-seed.225274.xyz`)"
      - "traefik.http.routers.cross-seed.entrypoints=websecure"
      - "traefik.http.routers.cross-seed.tls=true"
      - "traefik.http.services.cross-seed.loadbalancer.server.port=2468"
      - "traefik.http.routers.cross-seed.tls.certresolver=letsencrypt"

  # Prowlarr
