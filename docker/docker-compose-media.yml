    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.profilarr.rule=Host(`profilarr.225274.xyz`)"
      - "traefik.http.routers.profilarr.entrypoints=websecure"
      - "traefik.http.routers.profilarr.tls=true"
      - "traefik.http.services.profilarr.loadbalancer.server.port=6868"
      - "traefik.http.routers.profilarr.tls.certresolver=letsencrypt"

  # Jellyfin
  # Ports: 8096
  jellyfin:
    # Needs root? error unable to access /data etc.
    # user: 1000:1000
    image: lscr.io/linuxserver/jellyfin:10.11.6
    container_name: jellyfin
    hostname: jellyfin
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${LCL_JELLYFIN_CONFIG}:/config
      - ${EXT_STORAGE_BASE}:/storage
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8096/health || exit 1" ]
      start_period: 5s
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.225274.xyz`)"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.http.routers.jellyfin.tls.certresolver=letsencrypt"
