  # Profilarr
  # Ports: 6868
  profilarr:
    image: santiagosayshey/profilarr:beta
    container_name: profilarr
    hostname: profilarr
    restart: unless-stopped
    networks:
      server_network:
        ipv4_address: 172.18.4.13
        ipv6_address: 2001:db8:1::413
    ports:
      - "6868:6868"
    volumes:
      - ${LCL_PROFILARR_CONFIG}:/config
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Kolkata"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:6868" ]
      start_period: 5s
