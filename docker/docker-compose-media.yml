  # Sonarr
  # Ports: 8989
  sonarr:
    user: 1000:1000
    image: lscr.io/linuxserver/sonarr:4.0.16
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped
    networks:
      server_network:
