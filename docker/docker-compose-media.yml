  prowlarr:
    user: 1000:1000
    image: lscr.io/linuxserver/prowlarr:2.3.0
    container_name: prowlarr
    hostname: prowlarr
    restart: unless-stopped
    networks:
      server_network:
        ipv4_address: 172.18.4.4
        ipv6_address: 2001:db8:1::404
    ports:
      - "9696:9696"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    volumes:
      - ${LCL_PROWLARR_CONFIG}:/config
    healthcheck:
      test: [ "CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9696" ]
      start_period: 5s
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.225274.xyz`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.routers.prowlarr.tls.certresolver=letsencrypt"

  # Radarr
  # Ports: 7878
  radarr:
    user: 1000:1000
    image: lscr.io/linuxserver/radarr:6.0.4
